name: Build, test and package

on:
  push:
    branches: [devel, main]
    tags: ['v*']
  pull_request:
    branches: [devel, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Portable Linux amd64 packages
    # An App token can trigger a push for the development tags CI creates.
    if: ${{ !startsWith(github.ref, 'refs/tags/') || !contains(github.ref_name, '-dev.') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RF_CI_COMMIT: ${{ github.sha }}
      RF_BUILD_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/') && 'stable' || 'development' }}
      RF_BUILD_NUMBER: ${{ github.run_number }}
      RF_CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Validate stable tag, release notes and main ancestry
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 ci/publish.py validate-tag "$RELEASE_TAG"
      - name: Build, test, package and check supported distributions
        run: bash ci/build.sh release
      - name: Upload runnable AppImage
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: CroccoSpectrum-linux-amd64-AppImage
          path: dist/ci/release/packages/*.AppImage
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload extract-and-run tarball
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: CroccoSpectrum-linux-amd64-portable
          path: dist/ci/release/packages/*-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload accompanying application and dependency sources
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: CroccoSpectrum-linux-amd64-sources
          path: dist/ci/release/sources/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload package verification and test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: reports-release
          path: dist/ci/release/reports/
          if-no-files-found: warn
          retention-days: 30

  upload-release:
    name: Publish verified stable or development release
    needs: release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/devel' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    concurrency:
      group: release-publish-${{ github.ref == 'refs/heads/devel' && github.run_id || 'stable' }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out the built source and release notes
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release token permissions prerequisite
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [[ -z "$RELEASE_TOKEN" ]] && ! git diff --quiet HEAD origin/main -- .github/workflows; then
            echo '::error::Publishing this commit requires a RELEASE_TOKEN with Contents and Workflows write permissions, or matching workflow files on main. See docs/CI.md.'
            exit 1
          fi
      - name: Download verified build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: release-assets
      - name: Upload to a draft and publish when complete
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 ci/publish.py publish
