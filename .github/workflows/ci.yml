name: Build, test and package

on:
  push:
    branches: [devel, main]
  pull_request:
    branches: [devel, main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    name: Portable Linux amd64 packages
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RF_CI_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build, test, package and check supported distributions
        run: bash ci/build.sh release
      - name: Upload runnable AppImage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CroccoSpectrum-linux-amd64-AppImage
          path: dist/ci/release/packages/*.AppImage
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload extract-and-run tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CroccoSpectrum-linux-amd64-portable
          path: dist/ci/release/packages/*-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload accompanying application and dependency sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CroccoSpectrum-linux-amd64-sources
          path: dist/ci/release/sources/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload package verification and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports-release
          path: dist/ci/release/reports/
          if-no-files-found: warn
          retention-days: 30

  upload-release:
    name: Upload GitHub release assets
    needs: release
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
      - name: Upload packages, sources and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            release-assets/CroccoSpectrum-linux-amd64-AppImage/*.AppImage \
            release-assets/CroccoSpectrum-linux-amd64-portable/*-x86_64.tar.gz \
            release-assets/CroccoSpectrum-linux-amd64-sources/*.tar.gz \
            release-assets/reports-release/checksums/*.sha256
